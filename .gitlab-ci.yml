# Include shared CI
include:
    - project: "epi2melabs/ci-templates"
      file: "wf-containers.yaml"

variables:
    # We'll use the single-file case for these runs
    NF_WORKFLOW_OPTS: "--fastq test_data/fastq --sample_sheet test_data/sample_sheet.csv --downsample 50"
    CI_FLAVOUR: "new"
    SKIP_PYTHON_TESTS: "not applicable"
    PYTEST_CONTAINER_NAME: "wf-common"
    PYTEST_CONTAINER_CONFIG_KEY: "common_sha"

docker-run:
    parallel:
        matrix:
          - MATRIX_NAME: [
              "default",
              "ont-b-victoria",
              "bad_reference",
              "no-nextclade",
              "single-sample",
              "bam"
            ]
    rules:
        - if: ($CI_COMMIT_BRANCH == null || $CI_COMMIT_BRANCH == "dev-template")
          when: never
        - if: $MATRIX_NAME == "default"
          variables:
              NF_WORKFLOW_OPTS: "--fastq test_data/fastq --sample_sheet test_data/sample_sheet.csv --downsample 50"
        - if: $MATRIX_NAME == "ont-b-victoria"
          variables:
              TMP_PATH: "$CI_PROJECT_NAME/data/${CI_JOB_ID}"
              CMD_LOCAL_SETUP: 'mkdir -p "${TMP_PATH}" && get_artifactory "EPI2ME/data/wf-flu/wf-flu-b-victoria-ont-v1.tar.gz" "${TMP_PATH}" && tar -xzf "${TMP_PATH}/wf-flu-b-victoria-ont-v1.tar.gz" -C "${TMP_PATH}"'
              NF_WORKFLOW_OPTS: '--fastq ${TMP_PATH}/wf-flu-b-victoria-ont-v1/fastq --sample_sheet ${TMP_PATH}/wf-flu-b-victoria-ont-v1/sample_sheet.csv --override_basecaller_cfg dna_r10.4.1_e8.2_400bps_hac@v5.2.0 --downsample 50'
              AFTER_NEXTFLOW_CMD: 'cmp wf-flu/wf-flu-results.csv ${TMP_PATH}/wf-flu-b-victoria-ont-v1/expected_results.csv'
        - if: $MATRIX_NAME == "bad_reference"
          variables:
              NF_WORKFLOW_OPTS: "--fastq test_data/fastq --sample_sheet test_data/sample_sheet.csv --downsample 50 --reference test_data/bad_reference.fasta"
        - if: $MATRIX_NAME == "no-nextclade"
          variables:
              NF_WORKFLOW_OPTS: "--fastq test_data/rbk_fastq --sample_sheet test_data/sample_sheet_rbk.csv --override_basecaller_cfg dna_r10.4.1_e8.2_400bps_hac@v3.5.2"
              # This lane intentionally skips optional downsampling and only
              # exists to exercise the no-nextclade path.
              NF_IGNORE_PROCESSES: "nextclade,downSample,roughDownSample"
        # This will have no barcode in metadata to see if report handles this      
        - if: $MATRIX_NAME == "single-sample"
          variables:
            NF_WORKFLOW_OPTS: "--fastq test_data/fastq/barcode92 --downsample 50"
        - if: $MATRIX_NAME == "bam"
          variables:
              NF_WORKFLOW_OPTS: "--bam test_data/bam --sample_sheet test_data/sample_sheet.csv --downsample 50 --override_basecaller_cfg dna_r10.4.1_e8.2_400bps_hac@v3.5.2"
              AFTER_NEXTFLOW_CMD: cmp wf-flu/H3N2-strain-A-Wisconsin-15-2009-VR-1882DQ/typing/insaflu.typing.txt test_data/expected_results/expected_typing.txt
        
